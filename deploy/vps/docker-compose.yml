# Eleventory SaaS on one VPS (Phase 8). NOT used by the live cPanel site.
#
#   cp .env.example .env && edit it
#   docker compose up -d --build
#
# Services: caddy (HTTPS, on-demand certificates) -> web (Next.js) and api (Laravel, nginx+php-fpm),
# plus worker (queues), scheduler (cron), mariadb, redis. Only caddy publishes ports.
# This file has NOT been run against a real server yet: follow RUNBOOK.md and expect to adjust.

x-api: &api
  build: ../../backend
  image: eleventory-api
  restart: unless-stopped
  env_file: .env
  environment: &api-env
    APP_ENV: production
    APP_DEBUG: "false"
    DB_HOST: mariadb
    DB_PORT: "3306"
    REDIS_HOST: redis
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: redis
    SAAS_MODE: "true"
    AUTORUN_ENABLED: "false"          # only the api service runs migrations
  depends_on:
    mariadb: { condition: service_healthy }
    redis: { condition: service_started }
  volumes:
    - storage:/var/www/html/storage

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file: .env
    depends_on: [web, api]

  web:
    build:
      context: ../../frontend
      args:
        NEXT_PUBLIC_API_URL: https://api.${PLATFORM_DOMAIN}/api/v1
        NEXT_PUBLIC_SITE_URL: https://${PLATFORM_DOMAIN}
    restart: unless-stopped
    environment:
      MULTI_STORE: "true"
      PLATFORM_HOSTS: ${PLATFORM_DOMAIN},app.${PLATFORM_DOMAIN}
      STOREFRONT_SSR_KEY: ${STOREFRONT_SSR_KEY}
    depends_on: [api]

  api:
    <<: *api
    environment:
      <<: *api-env
      AUTORUN_ENABLED: "true"          # migrate + cache config/routes on boot
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *api
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600", "--sleep=3"]
    deploy: { replicas: 1 }

  scheduler:
    <<: *api
    environment:
      <<: *api-env
      HEALTH_REQUIRE_SCHEDULER: "true"
    command: ["php", "artisan", "schedule:work"]

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes: [db:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: [redis:/data]

volumes:
  storage:
  db:
  redis:
  caddy_data:
  caddy_config:
