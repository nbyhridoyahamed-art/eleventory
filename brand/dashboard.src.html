<title>Eleventory Dashboard Design</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;600;800&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: dark teal rail on the left, calm mist canvas, cards only where a chart or table needs an edge.
   Chart colour: single series use brand teal; categorical series use the validated reference slots, one fixed colour per entity. */
:root{
  --canvas:#F1F4F3; --card:#F8FAF9; --ink:#0A2E2C; --muted:#566D6B; --line:#D3DDDB; --edge:#6F8683;
  --teal:#0B5D59; --teal-soft:#DDEDEA; --coral:#FF6A4D; --coral-text:#BC381F; --sun:#F7B538; --sun-soft:#FDEFCB;
  --rail:#0A2E2C; --rail-text:#E6EFEE; --rail-muted:#9DB8B5; --on-teal:#F6F9F8; --grid:#DCE4E2;
  --ok:#1E7A4C; --warn:#8A5A00; --bad:#B3261E;
  --q1:#DDEDEA; --q2:#B5DAD5; --q3:#85C2BB; --q4:#52A39B; --q5:#2A817A; --q6:#0B5D59; --q7:#073F3C;
  --s-fb:#2a78d6; --s-web:#eb6834; --s-wa:#1baf7a; --s-walk:#eda100; --s-bkash:#e87ba4; --s-nagad:#eb6834; --s-cod:#1baf7a; --s-card:#2a78d6; --s-other:#8a9a98;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --body:"Figtree","Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace; --bn:"Anek Bangla","Noto Sans Bengali","Nirmala UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#0A1F1E; --card:#102B29; --ink:#E6EFEE; --muted:#9DB3B0; --line:#1E3F3C; --edge:#5E8480;
  --teal:#4FC3B8; --teal-soft:#14403D; --coral:#FF7D63; --coral-text:#FF8F78; --sun-soft:#3A2D0E;
  --rail:#071918; --rail-text:#E6EFEE; --rail-muted:#8FAAA7; --on-teal:#06201F; --grid:#1B3835;
  --ok:#5FD39A; --warn:#E8B04A; --bad:#FF8A80;
  --q1:#12302E; --q2:#17504B; --q3:#1F746D; --q4:#2E9A91; --q5:#4FC3B8; --q6:#86DDD3; --q7:#BDF0E9;
  --s-fb:#3987e5; --s-web:#d95926; --s-wa:#199e70; --s-walk:#c98500; --s-bkash:#d55181; --s-nagad:#d95926; --s-cod:#199e70; --s-card:#3987e5; --s-other:#6f8683; color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:#0A1F1E; --card:#102B29; --ink:#E6EFEE; --muted:#9DB3B0; --line:#1E3F3C; --edge:#5E8480;
  --teal:#4FC3B8; --teal-soft:#14403D; --coral:#FF7D63; --coral-text:#FF8F78; --sun-soft:#3A2D0E;
  --rail:#071918; --rail-text:#E6EFEE; --rail-muted:#8FAAA7; --on-teal:#06201F; --grid:#1B3835;
  --ok:#5FD39A; --warn:#E8B04A; --bad:#FF8A80;
  --q1:#12302E; --q2:#17504B; --q3:#1F746D; --q4:#2E9A91; --q5:#4FC3B8; --q6:#86DDD3; --q7:#BDF0E9;
  --s-fb:#3987e5; --s-web:#d95926; --s-wa:#199e70; --s-walk:#c98500; --s-bkash:#d55181; --s-nagad:#d95926; --s-cod:#199e70; --s-card:#3987e5; --s-other:#6f8683; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font:400 15px/1.5 var(--body)}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.15}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
/* rail */
.rail{background:var(--rail);color:var(--rail-text);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px}
.rail .logo{padding:0 8px}.rail .logo svg{width:150px;height:auto;display:block}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--rail-muted);text-decoration:none;font-weight:600;font-size:14px}
.nav a svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:rgba(255,255,255,.07);color:var(--rail-text)}
.nav a[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 3px 0 0 var(--coral)}
.nav .sec{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--rail-muted);opacity:.7;padding:14px 12px 4px}
.plan{margin-top:auto;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:14px;font-size:13px;color:var(--rail-muted)}
.plan b{color:var(--rail-text);display:block;font:700 14px var(--display);margin-bottom:6px}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.14);margin:8px 0 6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--coral);border-radius:3px}
/* top */
.main{min-width:0;padding:0 clamp(16px,3vw,32px) 64px}
.top{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between;padding:18px 0;position:sticky;top:0;background:var(--canvas);z-index:20;border-bottom:1px solid var(--line)}
.top h1{font-size:26px;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:14px;margin-top:2px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--edge);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);font:600 13px var(--body);padding:8px 13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--on-teal)}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
.ibtn{border:1.5px solid var(--edge);background:transparent;color:var(--ink);border-radius:10px;padding:8px 12px;font:600 13px var(--body);cursor:pointer}
.ava{width:34px;height:34px;border-radius:50%;background:var(--sun);color:#0A2E2C;display:grid;place-items:center;font:800 14px var(--display)}
/* grid + cards */
.view{display:grid;gap:18px;margin-top:20px;grid-template-columns:repeat(12,minmax(0,1fr))}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:1180px){.c3{grid-column:span 6}.c4,.c5{grid-column:span 6}.c7,.c8{grid-column:span 12}}
@media (max-width:900px){.app{grid-template-columns:1fr}.rail{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:10px}.rail .logo svg{width:120px}.nav{flex-direction:row}.nav .sec,.plan{display:none}.top{position:static}}
@media (max-width:640px){.view>*{grid-column:span 12!important}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.card h3{font-size:16px;font-weight:700}
.card .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.pill{font:600 11px var(--mono);letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}
.sect{grid-column:1/-1;display:flex;align-items:baseline;gap:12px;margin-top:10px}
.sect h2{font-size:20px}.sect span{color:var(--muted);font-size:13.5px}
/* kpi */
.kpi .lab{font-size:13px;color:var(--muted);font-weight:600}
.kpi .val{font:800 30px/1.1 var(--display);letter-spacing:-.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .dl{font:600 12px var(--mono)}.dl.up{color:var(--ok)}.dl.dn{color:var(--bad)}
.kpi svg{width:100%;height:46px;display:block;margin-top:8px}
/* svg text */
svg text{font-family:var(--body);fill:var(--muted);font-size:11px}
svg .t-ink{fill:var(--ink)}
svg .grid{stroke:var(--grid);stroke-width:1}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--ink)}
.leg span{display:inline-flex;gap:7px;align-items:center}.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){
  .bar{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.7,.2,1) both}
  .hbar{transform-box:fill-box;transform-origin:left;animation:growx .7s cubic-bezier(.2,.7,.2,1) both}
  .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease forwards}
  .fadein{animation:fade .8s ease both}
  .ring{animation:ring 1s cubic-bezier(.2,.7,.2,1) both}
  .feed li{animation:slide .5s ease both}
}
@keyframes grow{from{transform:scaleY(0)}}@keyframes growx{from{transform:scaleX(0)}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes fade{from{opacity:0}}@keyframes slide{from{opacity:0;transform:translateY(-8px)}}@keyframes ring{from{stroke-dasharray:0 999}}
/* tooltip */
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--canvas);padding:8px 11px;border-radius:9px;font-size:12.5px;line-height:1.45;max-width:240px;opacity:0;transition:opacity .08s}
#tip b{font-weight:700}
/* tables, chips, lists */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:640px}
th{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.mono{font-family:var(--mono);font-size:12.5px}
.st{display:inline-flex;gap:6px;align-items:center;font:600 12px var(--body);padding:3px 10px;border-radius:999px;white-space:nowrap}
.st:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-new{background:var(--teal-soft);color:var(--teal)}.s-pack{background:var(--sun-soft);color:var(--warn)}.s-ship{background:var(--teal-soft);color:var(--ink)}.s-ok{background:var(--teal-soft);color:var(--ok)}.s-bad{background:#FFE3DC;color:var(--bad)}
:root[data-theme="dark"] .s-bad{background:#3A211C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .s-bad{background:#3A211C}}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.feed li:last-child{border-bottom:0}
.feed .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:800 12px var(--display);color:#fff;flex:none}
.feed .grow{flex:1;min-width:0}.feed .grow span{display:block;color:var(--muted);font-size:12.5px}
.tops{display:grid;gap:12px}
.toprow{display:grid;grid-template-columns:34px minmax(0,1fr) 78px 64px;gap:12px;align-items:center;font-size:13.5px}
.toprow .th{width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.toprow .th svg{width:22px;height:22px}
.bartrack{height:8px;border-radius:4px;background:var(--grid);margin-top:5px;overflow:hidden}
.bartrack i{display:block;height:100%;border-radius:4px;background:var(--teal)}
.toprow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kan{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.col{background:var(--canvas);border:1px solid var(--line);border-radius:12px;padding:10px}
.col h4{font:700 13px var(--body);display:flex;justify-content:space-between;margin-bottom:8px}
.oc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.oc b{font-family:var(--mono);font-size:12px}
.prods{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.prod{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.prod .ph{aspect-ratio:1/1;display:grid;place-items:center;position:relative}
.prod .ph svg{width:56%;height:auto}
.prod .pi{padding:12px 14px 14px}
.prod h4{font:600 14px var(--body);margin:0 0 2px}
.flag{position:absolute;top:10px;left:10px;font:700 10.5px var(--mono);padding:4px 8px;border-radius:999px;background:var(--coral);color:#0A2E2C}
.flag.sun{background:var(--sun)}
.cap{font-size:12.5px;color:var(--muted)}
.empty{display:flex;gap:6px;align-items:flex-end;height:60px}
.vh{position:absolute;left:-9999px}
</style>

<div class="app">
  <aside class="rail">
    <div class="logo">{{logo-horizontal-reverse}}</div>
    <nav class="nav" aria-label="Main">
      <a href="#overview" data-v="overview"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Overview</a>
      <a href="#analytics" data-v="analytics"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Analytics</a>
      <div class="sec">Sell</div>
      <a href="#orders" data-v="orders"><svg viewBox="0 0 24 24"><path d="M6 7h15l-1.5 9h-12zM6 7L5 3H2M9 20h.01M18 20h.01"/></svg>Orders</a>
      <a href="#products" data-v="products"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5zM3 8v8l9 5 9-5V8M12 13v8"/></svg>Products and stock</a>
      <a href="#customers" data-v="customers"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M17 11a3 3 0 1 0 0-6M18.5 14.7c1.9.6 3 2.4 3.5 5.3"/></svg>Customers</a>
    </nav>
    <div class="plan"><b>Growth plan</b>Orders this month<div class="meter"><i style="width:62%"></i></div>1,240 of 2,000</div>
  </aside>

  <div class="main">
    <header class="top">
      <div><h1 id="ttl">Overview</h1><div class="sub" id="sub"></div></div>
      <div class="tools">
        <div class="seg" role="group" aria-label="Date range" id="rng"><button type="button" data-r="7" aria-pressed="false">7 days</button><button type="button" data-r="30" aria-pressed="true">30 days</button><button type="button" data-r="90" aria-pressed="false">90 days</button></div>
        <label class="chk"><input type="checkbox" id="cmp" checked> Compare with previous</label>
        <button class="ibtn" id="lang" type="button" aria-label="Language">EN / বাং</button>
        <button class="ibtn" id="themeBtn" type="button">Dark / light</button>
        <div class="ava" aria-hidden="true">N</div>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>
<div id="tip" role="tooltip"></div>

<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const money=n=>"৳"+Math.round(n).toLocaleString("en-IN");
const short=n=>n>=1e5?(n/1e5).toFixed(n>=1e6?0:1).replace(/\.0$/,"")+"L":n>=1e3?(n/1e3).toFixed(n>=1e4?0:1).replace(/\.0$/,"")+"k":""+Math.round(n);
const TODAY=new Date(2026,10,13);
const dlab=(i,n)=>{const d=new Date(TODAY);d.setDate(d.getDate()-(n-1-i));return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})};
const esc=s=>String(s).replace(/"/g,"&quot;");
const tip=h=>`data-tip="${esc(h)}" tabindex="0"`;
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of[1,1.5,2,2.5,3,4,5,6,8,10]){if(m*p>=v)return m*p}return 10*p}
function series(n,base,seed,amp=.28){const r=rng(seed),o=[];for(let i=0;i<n;i++){const dow=(i+n)%7,w=1+(dow>=4&&dow<=5?.32:0)-(dow===1?.1:0),tr=1+i/n*.22;o.push(base*tr*w*(1-amp/2+amp*r()))}return o}
const state={range:30,cmp:true,view:"overview",lang:"en"};

/* ---------- charts ---------- */
function sparkline(vals,kind,color="var(--teal)"){
  const W=200,H=46,p=4,mx=Math.max(...vals),mn=Math.min(...vals),n=vals.length;
  const x=i=>p+i/(n-1)*(W-2*p),y=v=>H-p-(v-mn)/(mx-mn||1)*(H-2*p-2);
  if(kind==="bars"){const bw=(W-2*p)/n;return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${vals.map((v,i)=>`<rect class="bar" x="${p+i*bw+1}" y="${y(v)}" width="${bw-3}" height="${H-p-y(v)}" rx="2" fill="${color}" opacity="${i===n-1?1:.55}"/>`).join("")}</svg>`}
  let d=vals.map((v,i)=>(kind==="step"?(i?`H${x(i)}V${y(v)}`:`M${x(i)} ${y(v)}`):(i?"L":"M")+x(i)+" "+y(v))).join("");
  const area=kind==="area"?`<path d="${d}L${x(n-1)} ${H}L${x(0)} ${H}Z" fill="${color}" opacity=".16"/>`:"";
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${area}<path class="draw" pathLength="1" d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(n-1)}" cy="${y(vals[n-1])}" r="3.5" fill="${color}" stroke="var(--card)" stroke-width="2"/></svg>`;
}
function kpi(label,val,delta,vals,kind,color){const up=delta>=0;return `<article class="card kpi c3"><div class="lab">${label}</div><div class="val num">${val}</div><div class="dl ${up?"up":"dn"}">${up?"▲":"▼"} ${Math.abs(delta)}% vs previous</div>${sparkline(vals,kind,color)}</article>`}

function area(id,cur,prev,{h=250,fy=short,fmt=money}={}){
  const W=640,H=h,m={l:42,r:12,t:12,b:26},iw=W-m.l-m.r,ih=H-m.t-m.b,n=cur.length;
  const max=niceMax(Math.max(...cur,...(prev||[0]))),x=i=>m.l+i/(n-1)*iw,y=v=>m.t+ih-v/max*ih;
  const line=a=>a.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join("");
  let g="";for(let t=0;t<=4;t++){const v=max*t/4,yy=y(v);g+=`<line class="grid" x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}"/><text x="${m.l-8}" y="${yy+4}" text-anchor="end">${fy(v)}</text>`}
  const step=Math.ceil(n/6);let xl="";for(let i=0;i<n;i+=step)xl+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${dlab(i,n)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" data-xh="${id}" role="img" aria-label="Line chart with ${n} points">
   <defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--teal)" stop-opacity=".28"/><stop offset="1" style="stop-color:var(--teal)" stop-opacity="0"/></linearGradient></defs>
   ${g}${xl}<path class="fadein" d="${line(cur)}L${x(n-1)} ${y(0)}L${x(0)} ${y(0)}Z" fill="url(#g${id})"/>
   ${prev?`<path d="${line(prev)}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".8"/>`:""}
   <path class="draw" pathLength="1" d="${line(cur)}" fill="none" stroke="var(--teal)" stroke-width="2.4" stroke-linejoin="round"/>
   <circle cx="${x(n-1)}" cy="${y(cur[n-1])}" r="4.5" fill="var(--teal)" stroke="var(--card)" stroke-width="2"/>
   <g class="xh" style="display:none"><line class="xl" y1="${m.t}" y2="${m.t+ih}" stroke="var(--edge)" stroke-dasharray="3 3"/><circle class="xd" r="5" fill="var(--teal)" stroke="var(--card)" stroke-width="2"/></g>
   <rect class="xr" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/>
  </svg>`;
}
function wireArea(el,cur,prev,fmt=money){
  const svg=el.querySelector("svg[data-xh]");if(!svg)return;const W=640,m={l:42,r:12},iw=W-m.l-m.r,n=cur.length,max=niceMax(Math.max(...cur,...(prev||[0])));
  const gx=svg.querySelector(".xh"),xl=svg.querySelector(".xl"),xd=svg.querySelector(".xd"),r=svg.querySelector(".xr"),H=+svg.viewBox.baseVal.height,ih=H-12-26;

  for(let t=0;t<=4;t++)c+=`<line class="grid" x1="${m.l}" x2="${W-m.r}" y1="${y(t*50)}" y2="${y(t*50)}"/><text x="${m.l-8}" y="${y(t*50)+4}" text-anchor="end">${t*50}</text>`;
  d.forEach(([n,v],i)=>c+=`<rect class="bar" ${tip(`<b>${n} day${n==="1"?"":"s"}</b><br>${v} parcels`)} x="${m.l+i*bw+3}" y="${y(v)}" width="${bw-6}" height="${y(0)-y(v)}" rx="4" fill="var(--teal)" opacity="${i===2?1:.62}"/><text x="${m.l+i*bw+bw/2}" y="${H-18}" text-anchor="middle">${n}</text>`);
  c+=`<line x1="${m.l+2.5*bw}" x2="${m.l+2.5*bw}" y1="${m.t}" y2="${m.t+ih}" stroke="var(--coral)" stroke-width="2" stroke-dasharray="4 3"/><text x="${m.l+2.5*bw+6}" y="${m.t+10}" style="fill:var(--coral-text);font-weight:700">Median 3 days</text><text x="${m.l+iw/2}" y="${H-2}" text-anchor="middle">Days from order to delivery</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Delivery time histogram">${c}</svg>`;
}
function lollipop(){
  const d=[["Wrong size",31],["Late delivery",22],["Not as shown",17],["Damaged",9],["Changed mind",7]],W=520,rh=36,H=d.length*rh+6;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Return reasons">${d.map(([n,v],i)=>{const y=i*rh+rh/2+3,x=130+v/35*340;return `<g ${tip(`<b>${n}</b><br>${v} returns`)}><text x="122" y="${y+4}" text-anchor="end" class="t-ink" style="font-size:12.5px">${n}</text><line class="hbar" x1="130" x2="${x}" y1="${y}" y2="${y}" stroke="var(--coral)" stroke-width="3" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="7" fill="var(--coral)" stroke="var(--card)" stroke-width="2"/><text x="${x+14}" y="${y+4}" class="t-ink num" style="font-weight:700">${v}</text></g>`}).join("")}</svg>`;
}
function pipeline(){
  const st=[["New",14],["Packing",9],["Shipped",22],["Delivered",118],["Returned",4]],tot=st.reduce((s,a)=>s+a[1],0);let x=0;
  return `<svg viewBox="0 0 560 32" role="img" aria-label="Order pipeline">${st.map(([n,v],i)=>{const w=v/tot*556;const s=`<g ${tip(`<b>${n}</b><br>${v} orders`)}><rect class="hbar" x="${x+1}" y="0" width="${Math.max(6,w-2)}" height="30" rx="6" fill="var(--q${[3,4,5,6,2][i]})"/>${w>40?`<text x="${x+w/2}" y="20" text-anchor="middle" style="fill:${i>=2&&i<4?"#F6F9F8":"#0A2E2C"};font-weight:700;font-size:12px">${v}</text>`:""}</g>`;x+=w;return s}).join("")}</svg><div class="leg">${st.map(([n,v],i)=>`<span><i style="background:var(--q${[3,4,5,6,2][i]})"></i>${n} ${v}</span>`).join("")}</div>`;
}
function feed(){
  const L=[["bK","bKash","#e87ba4","Rumana Akter","৳2,490 · Jamdani cotton saree","just now"],["N","Nagad","#eb6834","Tanvir Hasan","৳1,450 · Slim power bank","4 min"],["C","COD","#1baf7a","Sadia Islam","৳3,000 · Leather tote bag, Chattogram","11 min"],["bK","bKash","#e87ba4","Imran Hossain","৳650 · Hand-thrown clay mug ×2","26 min"],["C","COD","#1baf7a","Farhana Yasmin","৳1,890 · Canvas low sneaker","41 min"]];
  return `<ul class="feed">${L.map((o,i)=>`<li style="animation-delay:${i*.09}s"><span class="dot" style="background:${o[2]}" aria-hidden="true">${o[0]}</span><div class="grow"><b>${o[3]}</b><span>${o[4]}</span></div><div style="text-align:right"><span class="st ${i===0?"s-new":"s-pack"}">${i===0?"New":"Packing"}</span><span class="cap" style="display:block;margin-top:3px">${o[5]}</span></div></li>`).join("")}</ul>`;
}

/* ---------- views ---------- */
const card=(cls,title,sub,body,pill="")=>`<article class="card chart ${cls}"><header><div><h3>${title}</h3>${sub?`<div class="sub">${sub}</div>`:""}</div>${pill?`<span class="pill">${pill}</span>`:""}</header>${body}</article>`;
const sect=(t,s)=>`<div class="sect"><h2>${t}</h2><span>${s}</span></div>`;
function data(){const n=state.range;return{n,cur:series(n,15800,3),prev:series(n,13400,9),ord:series(n,42,4,.4),vis:series(n,520,6,.3),aov:series(n,1100,8,.18)}}

const VIEWS={
 overview(){const d=data(),tot=a=>a.reduce((s,x)=>s+x,0);
  return `
  ${kpi("Revenue",money(tot(d.cur)),12.4,d.cur.slice(-14),"area")}
  ${kpi("Orders",Math.round(tot(d.ord)).toLocaleString("en-IN"),8.1,d.ord.slice(-14),"bars")}
  ${kpi("Visitors who buy","3.4%",0.6,series(14,3.4,12,.3),"line","var(--coral)")}
  ${kpi("Average order",money(1214),-2.3,d.aov.slice(-14),"step")}
  ${card("c8","Revenue","Daily, with the previous period dashed",`<div id="a1">${area("a1",d.cur,state.cmp?d.prev:null)}</div>`,state.range+" days")}
  ${card("c4","How customers pay","Share of revenue",donut([{n:"bKash",v:402000,c:"var(--s-bkash)"},{n:"Nagad",v:171000,c:"var(--s-nagad)"},{n:"Cash on delivery",v:268000,c:"var(--s-cod)"},{n:"Card",v:96000,c:"var(--s-card)"}],"৳9.4L","this month"))}
  ${card("c5","Where visitors drop off","Last 30 days",funnel([{n:"Visits",v:18420},{n:"Viewed a product",v:11260},{n:"Added to cart",v:2890},{n:"Started checkout",v:1210},{n:"Paid",v:634}]))}
  ${card("c7","When orders arrive","Orders by weekday and time",heat(),"Busiest: Fri 8 to 10pm")}
  ${card("c4","Best sellers","By revenue, this month",topProducts())}
  ${card("c4","Order pipeline","All open and recent orders",pipeline()+`<div style="margin-top:14px">${feed()}</div>`,"Live")}
  ${card("c4","Stock to reorder","Below the reorder level",bullets())}`},
 analytics(){const d=data();
  const wk=["W1","W2","W3","W4","W5","W6","W7","W8"],r=rng(21),ch=[0,1,2,3].map(k=>wk.map(()=>Math.round([120,70,48,24][k]*(.8+.5*r()))));
  return `${sect("Sales","How much came in, and from where")}
  ${card("c7","Revenue trend","Hover the line for the day",`<div id="a2">${area("a2",d.cur,d.prev,{h:270})}</div>`,state.range+" days")}
  ${card("c5","Net revenue walk","From gross sales to what you keep",waterfall())}
  ${card("c7","Orders by channel","Weekly, stacked",stacked("s1",wk,["Facebook","Website","WhatsApp","Walk-in"],["var(--s-fb)","var(--s-web)","var(--s-wa)","var(--s-walk)"],ch))}
  ${card("c5","Revenue by category","Area shows share",treemap())}
  ${card("c6","Daily orders","Last 18 weeks",calendar())}
  ${card("c6","Price against demand","Each bubble is a product",bubble())}
  ${sect("Customers","Who buys, who comes back, and where they live")}
  ${card("c7","Do they come back?","Share of each month's new buyers who bought again",cohort())}
  ${card("c5","Orders by division","Bangladesh",tilemap())}
  ${card("c4","Store health","Six scores out of 100",radar())}
  ${card("c4","Goals this month","Progress rings",`<div style="display:flex;gap:6px;justify-content:space-around;flex-wrap:wrap">${ringSvg(.78,"Sales target","78%")}${ringSvg(.91,"Packed in 24h","91%","var(--s-wa)")}${ringSvg(.032*8,"Return rate","3.2%","var(--coral)")}</div>`)}
  ${card("c4","Customer rating","From 412 reviews",`<div style="text-align:center">${gauge(.94,"4.7","out of 5")}</div><div class="cap" style="text-align:center">5 stars: 71% · 4 stars: 21% · 3 or fewer: 8%</div>`)}
  ${sect("Operations","Delivery, returns and stock")}
  ${card("c6","How long delivery takes","Parcels, last 30 days",histogram())}
  ${card("c6","Why parcels come back","Returns by reason",lollipop())}
  ${card("c6","Stock against reorder level","Six best sellers",bullets())}
  ${card("c6","Conversion funnel","Where visitors drop off",funnel([{n:"Visits",v:18420},{n:"Viewed a product",v:11260},{n:"Added to cart",v:2890},{n:"Started checkout",v:1210},{n:"Paid",v:634}]))}`},
 orders(){
  const cols=[["New",[["#ELV-20418","Rumana Akter","৳2,490","bKash"],["#ELV-20417","Tanvir Hasan","৳1,450","Nagad"],["#ELV-20416","Sadia Islam","৳3,000","COD"]]],["Packing",[["#ELV-20415","Imran Hossain","৳1,300","bKash"],["#ELV-20414","Farhana Yasmin","৳1,890","COD"]]],["Shipped",[["#ELV-20409","Nusrat Jahan","৳2,140","Card"],["#ELV-20408","Habib Rahman","৳650","COD"]]],["Delivered",[["#ELV-20401","Mitu Das","৳980","bKash"]]]];
  return `${card("c12","Orders at a glance","Drag cards between columns in the live product",`<div class="kan">${cols.map(([n,a])=>`<div class="col"><h4>${n}<span class="pill">${a.length}</span></h4>${a.map(o=>`<div class="oc"><b>${o[0]}</b><div style="margin:3px 0 6px">${o[1]}</div><div style="display:flex;justify-content:space-between"><span class="num" style="font-weight:700">${o[2]}</span><span class="cap">${o[3]}</span></div></div>`).join("")}</div>`).join("")}</div>`)}
  ${card("c12","Recent orders","Newest first",`<div class="tbl"><table><tr><th>Order</th><th>Customer</th><th>Placed</th><th>Pay with</th><th>Total</th><th>Status</th></tr>${[["#ELV-20418","Rumana Akter","Today, 9:41pm","bKash","৳2,490","s-new","New"],["#ELV-20415","Imran Hossain","Today, 8:15pm","bKash","৳1,300","s-pack","Packing"],["#ELV-20409","Nusrat Jahan","Today, 5:02pm","Card","৳2,140","s-ship","Shipped"],["#ELV-20401","Mitu Das","Yesterday","bKash","৳980","s-ok","Delivered"],["#ELV-20399","Kabir Ahmed","Yesterday","COD","৳1,750","s-bad","Returned"]].map(r=>`<tr><td class="mono">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td class="num"><b>${r[4]}</b></td><td><span class="st ${r[5]}">${r[6]}</span></td></tr>`).join("")}</table></div>`)}`},
 products(){
  return `${card("c12","Product presentation","Each product gets its own tint. Flags are coral for sale, sunflower for new.",`<div class="prods">${PRODUCTS.map((p,i)=>`<div class="prod"><div class="ph" style="background:${p.bg}">${i===0?'<span class="flag">-20%</span>':i===2?'<span class="flag sun">NEW</span>':p.s<=p.ro?'<span class="flag">'+p.s+' LEFT</span>':""}${THUMB[p.k](p.c)}</div><div class="pi"><h4>${p.n}</h4><div style="display:flex;justify-content:space-between;align-items:baseline"><b class="num" style="font:700 16px var(--display)">${money(p.price)}</b><span class="cap num">${p.s} in stock</span></div></div></div>`).join("")}</div>`)}
  ${card("c6","Stock against reorder level","",bullets())}
  ${card("c6","Where the money comes from","Revenue by category",treemap())}`},
 customers(){return `
  ${card("c7","Do they come back?","Repeat buying by month joined",cohort())}
  ${card("c5","Orders by division","",tilemap())}
  ${card("c6","Customer segments","Share of revenue",donut([{n:"Repeat buyers",v:520,c:"var(--s-fb)"},{n:"First order",v:310,c:"var(--s-web)"},{n:"Wholesale",v:140,c:"var(--s-wa)"},{n:"Dormant, back again",v:60,c:"var(--s-walk)"}],"1,030","customers"))}
  ${card("c6","Customer rating","From 412 reviews",`<div style="text-align:center">${gauge(.94,"4.7","out of 5")}</div>`)}`}
};
const TITLES={overview:["Overview","Friday 13 November · 14 orders are waiting to be packed"],analytics:["Analytics","Every chart reads from the same orders, so the numbers always agree"],orders:["Orders","Open, packing, shipped and done"],products:["Products and stock","What you sell, what is running low"],customers:["Customers","Who buys, who comes back"]};

function render(){
  const v=state.view,t=TITLES[v];$("#ttl").textContent=t[0];$("#sub").textContent=t[1];
  document.querySelectorAll(".nav a").forEach(a=>a.toggleAttribute("aria-current",a.dataset.v===v)||0);
  document.querySelectorAll(".nav a").forEach(a=>{if(a.dataset.v===v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  $("#view").innerHTML=VIEWS[v]();
  const d=data();["a1","a2"].forEach(id=>{const el=document.getElementById(id);if(el)wireArea(el,d.cur,state.cmp?d.prev:null)});
}
/* tooltip */
const T=$("#tip");
function showTip(e,html){T.innerHTML=html;T.style.opacity=1;const w=T.offsetWidth,x=Math.min(innerWidth-w-8,e.clientX+14);T.style.left=x+"px";T.style.top=(e.clientY+16)+"px"}
function hideTip(){T.style.opacity=0}
document.addEventListener("mousemove",e=>{const t=e.target.closest&&e.target.closest("[data-tip]");if(t)showTip(e,t.dataset.tip);else if(!e.target.closest(".xr"))hideTip()});
document.addEventListener("focusin",e=>{const t=e.target.closest("[data-tip]");if(t){const b=t.getBoundingClientRect();showTip({clientX:b.left+b.width/2,clientY:b.top},t.dataset.tip)}});
document.addEventListener("focusout",hideTip);
document.addEventListener("click",e=>{const t=e.target.closest("[data-tip]");if(t&&matchMedia("(hover:none)").matches)showTip(e,t.dataset.tip)});
/* controls */
$("#rng").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;state.range=+b.dataset.r;document.querySelectorAll("#rng button").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
$("#cmp").addEventListener("change",e=>{state.cmp=e.target.checked;render()});
$("#themeBtn").addEventListener("click",()=>{const r=document.documentElement,d=r.getAttribute("data-theme")==="dark"||(r.getAttribute("data-theme")!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);r.setAttribute("data-theme",d?"light":"dark")});
$("#lang").addEventListener("click",()=>{const b=$("#lang");state.lang=state.lang==="en"?"bn":"en";b.textContent=state.lang==="en"?"EN / বাং":"বাং / EN";document.body.style.fontFamily=state.lang==="bn"?"var(--bn)":"";if(state.lang==="bn"){$("#sub").textContent="আজ ১৩ নভেম্বর · ১৪টি অর্ডার প্যাক করার অপেক্ষায়"}else render()});
function route(){const h=(location.hash||"#overview").slice(1);state.view=VIEWS[h]?h:"overview";render()}
addEventListener("hashchange",route);route();
</script>
